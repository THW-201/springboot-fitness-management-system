<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大学生健身管理系统</title>
  <style>
    /* 加载动画 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    .loading-content {
      text-align: center;
      color: white;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 18px;
      margin-top: 20px;
    }

    .loading-subtext {
      font-size: 14px;
      margin-top: 10px;
      opacity: 0.8;
    }

    #app {
      min-height: 100vh;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BfFn-LJC.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CCOjoKdJ.css">
</head>

<body>
  <!-- 加载动画 -->
  <div id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载系统...</div>
      <div class="loading-subtext">请稍候</div>
    </div>
  </div>

  <!-- Vue 应用挂载点 -->
  <div id="app"></div>

</body>

</html>
